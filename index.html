<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catalogue Koi - Les Etangs d'Occitanie</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f6f5f1;color:#242424;font-family:Arial,sans-serif}
header{background:#172b35;color:white;text-align:center;padding:32px 16px}
h1{font-size:28px;margin:0 0 10px}
header p{margin:0;color:#d8e1e5}
main{max-width:1250px;margin:auto;padding:24px 16px}
input{width:100%;padding:15px;border:1px solid #ccc;border-radius:8px;font-size:17px}
#compteur{margin:18px 0;color:#555}
#galerie{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:20px}
.carte{background:white;border-radius:10px;overflow:hidden;box-shadow:0 2px 10px #0001}
.carte img{width:100%;height:290px;object-fit:contain;background:#eee;display:block}
.ref{padding:14px;text-align:center;font-weight:bold}
#message{color:#666;text-align:center;padding:30px}
</style>
</head>
<body>
<header>
<h1>Les Etangs d'Occitanie</h1>
<p>Catalogue de nos koi</p>
</header>
<main>
<input id="recherche" placeholder="Rechercher une référence (ex : EO26134)">
<div id="compteur">Chargement des photos...</div>
<div id="galerie"></div>
<p id="message"></p>
</main>
<script>
const utilisateur="sec-cmyk";
const depot="Catalogue-koi";
let poissons=[];

async function charger(){
 const galerie=document.getElementById("galerie");
 const compteur=document.getElementById("compteur");
 const message=document.getElementById("message");
 try{
  const url=`https://api.github.com/repos/${utilisateur}/${depot}/contents/photos`;
  const reponse=await fetch(url);
  if(!reponse.ok)throw new Error("Chargement impossible");
  const fichiers=await reponse.json();
  poissons=fichiers.filter(f=>/\.(jpg|jpeg|png|webp)$/i.test(f.name))
   .map(f=>({
    reference:f.name.replace(/\.[^.]+$/,""),
    image:f.download_url
   }))
   .sort((a,b)=>a.reference.localeCompare(b.reference,undefined,{numeric:true}));
  afficher();
 }catch(e){
  compteur.textContent="";
  message.textContent="Impossible de charger les photos. Réessayez plus tard.";
 }
}
function afficher(){
 const recherche=document.getElementById("recherche").value.trim().toLowerCase();
 const resultat=poissons.filter(p=>p.reference.toLowerCase().includes(recherche));
 document.getElementById("compteur").textContent=resultat.length+" poisson(s)";
 const galerie=document.getElementById("galerie");
 galerie.replaceChildren();
 for(const p of resultat){
  const carte=document.createElement("div");
  carte.className="carte";
  const lien=document.createElement("a");
  lien.href=p.image;
  lien.target="_blank";
  lien.rel="noopener noreferrer";
  const img=document.createElement("img");
  img.src=p.image;
  img.alt="Koi "+p.reference;
  img.loading="lazy";
  lien.appendChild(img);
  const ref=document.createElement("div");
  ref.className="ref";
  ref.textContent=p.reference;
  carte.append(lien,ref);
  galerie.appendChild(carte);
 }
 document.getElementById("message").textContent=
 resultat.length?"":"Aucun poisson trouvé.";
}
document.getElementById("recherche").addEventListener("input",afficher);
charger();
</script>
</body>
</html>
